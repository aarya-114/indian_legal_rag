name: Phase 1 CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned CI test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run Phase 1 tests
        run: python -m unittest tests.test_phase1 -v
      - name: Run self-healing telemetry tests
        run: python -m unittest tests.test_self_healing_telemetry -v
      - name: Run remaining lightweight tests
        run: python -m unittest tests.test_evaluation_audit tests.test_text_cleaner_encoding -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --tag indian-legal-rag:ci .
